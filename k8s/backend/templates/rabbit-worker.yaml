apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.worker.name }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.worker.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.worker.name }}
      annotations:
        redeployAt: {{ .Values.redeployAt | quote }}
    spec:
      containers:
      - name: {{ .Values.worker.name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: Always
        command: {{ toJson .Values.worker.command }}
        env:
          - name: AMQP_URL
            valueFrom:
              secretKeyRef:
                name: backend-secret
                key: AMQP_URL
          
