apiVersion: v1
kind: Secret
metadata:
  name: backend-db-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  host: {{.Values.database.host}}
  port: {{.Values.database.port}}
  name: {{.Values.database.database}}
  username: {{ .Values.database.username }}
  password: {{ .Values.database.password }}