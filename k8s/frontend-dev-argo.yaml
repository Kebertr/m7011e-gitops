apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Kebertr/m7011e-gitops.git
    targetRevision: main
    path: k8s/frontend
    helm:
      valueFiles:
        - ../environments/frontend/dev/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: frontend-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
