apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: video-service-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Kebertr/m7011e-gitops.git
    targetRevision: main
    path: k8s/video-service

  destination:
    server: https://kubernetes.default.svc
    namespace: video-service-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
